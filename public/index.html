<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Caretaker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f6f3ee; color: #2b2b2b; height: 100vh; display: flex; justify-content: center; align-items: center; }
  #app { width: 100%; max-width: 600px; height: 90vh; background: white; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.08); display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 18px 20px; background: #e8f0e6; color: #2d4a2d; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  header button { background: none; border: none; color: #2d4a2d; cursor: pointer; font-size: 13px; text-decoration: underline; }
  #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { padding: 10px 14px; border-radius: 14px; max-width: 85%; line-height: 1.45; font-size: 15px; white-space: pre-wrap; }
  .user { background: #4a6b4a; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
  .agent { background: #f0ede8; color: #2b2b2b; align-self: flex-start; border-bottom-left-radius: 4px; }
  .trace { font-size: 11px; color: #666; font-family: ui-monospace, monospace; padding: 6px 10px; background: #faf8f4; border-radius: 6px; align-self: flex-start; max-width: 90%; word-break: break-word; }
  .trace strong { color: #4a6b4a; }
  form { display: flex; padding: 12px; gap: 8px; border-top: 1px solid #eee; }
  input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 24px; font-size: 15px; outline: none; }
  input:focus { border-color: #4a6b4a; }
  button[type=submit] { padding: 12px 20px; background: #4a6b4a; color: white; border: none; border-radius: 24px; cursor: pointer; font-size: 15px; }
  button[type=submit]:disabled { opacity: 0.5; }

  #mic { background: #e8f0e6; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 18px; cursor: pointer; }
  #mic:hover { background: #d0dccd; }
  #mic.listening { background: #d9534f; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

  #mute { background: #e8f0e6; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 18px; cursor: pointer; }
  #mute:hover { background: #d0dccd; }
  #mute.muted { background: #f5d0cc; }

  .card { background: white; border: 1px solid #e0dcd5; border-radius: 12px; padding: 14px 16px; align-self: flex-start; max-width: 90%; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .card-alert { border-left: 4px solid #d9534f; background: #fdf5f5; }
  .card-slots { border-left: 4px solid #4a6b4a; background: #f5f8f4; }
  .card-weather { border-left: 4px solid #6a9bd4; background: #f4f8fc; }
  .card-success { border-left: 4px solid #2d7a2d; background: #f0f8f0; }
  .card-title { font-weight: 600; margin-bottom: 8px; color: #2b2b2b; }
  .card-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #f0ece6; }
  .card-row:last-child { border-bottom: none; }
  .badge { background: #d9534f; color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .slot-buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .slot-btn { padding: 8px 16px; background: #4a6b4a; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .slot-btn:hover { background: #3a5a3a; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span>🌿 Family Caretaker</span>
    <button onclick="reset()">Reset</button>
  </header>
  <div id="messages"></div>
  <form id="form">
    <input id="input" placeholder="Ask about inventory or book a delivery..." autocomplete="off" autofocus>
    <button type="button" id="mute" title="Mute voice">🔊</button>
    <button type="button" id="mic" title="Speak">🎤</button>
    <button type="submit" id="send">Send</button>
  </form>
</div>
<script>
const messagesEl = document.getElementById("messages");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const micBtn = document.getElementById("mic");
const muteBtn = document.getElementById("mute");
let voiceMuted = false;

function speak(text) {
  if (voiceMuted) return;
  if (!("speechSynthesis" in window)) return;
  if (!text || text === "…" || text.length > 500) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  utterance.rate = 1.0;
  utterance.pitch = 1.0;
  window.speechSynthesis.speak(utterance);
}

muteBtn.addEventListener("click", function() {
  voiceMuted = !voiceMuted;
  muteBtn.textContent = voiceMuted ? "🔇" : "🔊";
  muteBtn.classList.toggle("muted", voiceMuted);
  if (voiceMuted) window.speechSynthesis.cancel();
});

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addTrace(trace) {
  if (!trace || !trace.length) return;
  const div = document.createElement("div");
  div.className = "trace";
  div.innerHTML = trace.map(t =>
    "<strong>" + t.tool + "</strong>(" + JSON.stringify(t.args) + ") → " + String(t.result || "").slice(0, 100)
  ).join("<br>");
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function renderCard(card) {
  if (!card || !card.type) return;
  const div = document.createElement("div");

  if (card.type === "inventory_alert") {
    div.className = "card card-alert";
    var rows = (card.items || []).map(function(i) {
      return '<div class="card-row"><span>' + i.name + '</span><span class="badge">' + i.quantity + ' left</span></div>';
    }).join("");
    div.innerHTML = '<div class="card-title">⚠️ Low Stock Alert</div>' + rows;
  } else if (card.type === "slot_picker") {
    div.className = "card card-slots";
    if (!card.slots || card.slots.length === 0) {
      div.innerHTML = '<div class="card-title">📅 No Slots Available — ' + card.date + '</div>';
    } else {
      var btns = card.slots.map(function(s) {
        return '<button class="slot-btn" onclick="pickSlot(\'' + s + '\',\'' + card.date + '\')">' + s + '</button>';
      }).join("");
      div.innerHTML = '<div class="card-title">📅 Available Slots — ' + card.date + '</div><div class="slot-buttons">' + btns + '</div>';
    }
  } else if (card.type === "booking_confirmation") {
    div.className = "card card-success";
    div.innerHTML = '<div class="card-title">✅ Booking Confirmed</div>' +
      '<div class="card-row"><span>' + card.item + '</span></div>' +
      '<div class="card-row"><span>' + card.date + ' at ' + card.time + '</span></div>';
  } else if (card.type === "weather_forecast") {
    div.className = "card card-weather";
    var emoji = card.isRainy ? '🌧️' : '☀️';
    var title = card.isRainy ? 'Rain Expected' : 'Weather OK';
    div.innerHTML = '<div class="card-title">' + emoji + ' ' + title + '</div>' +
      '<div class="card-row"><span>' + card.city + ' — ' + card.date + '</span></div>' +
      '<div class="card-row"><span>Rain chance: ' + card.rainChance + '%</span></div>';
  } else {
    return;
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function pickSlot(time, date) {
  send("Yes, book the " + time + " slot on " + date + " for the low stock item");
}

async function send(text) {
  addMsg("user", text);
  input.value = "";
  sendBtn.disabled = true;
  const thinking = addMsg("agent", "…");
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    thinking.textContent = data.reply || data.error || "(no reply)";
    speak(data.reply || "");
    addTrace(data.trace);
    if (data.cards) data.cards.forEach(renderCard);
  } catch (e) {
    thinking.textContent = "Error: " + e.message;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", function(e) {
  e.preventDefault();
  const v = input.value.trim();
  if (v) send(v);
});

// Voice input
if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.onstart = function() { micBtn.classList.add("listening"); };
  recognition.onend = function() { micBtn.classList.remove("listening"); };
  recognition.onresult = function(event) {
    const transcript = event.results[0][0].transcript;
    input.value = transcript;
    send(transcript);
  };
  micBtn.addEventListener("click", function() {
    try { recognition.start(); } catch (e) { console.error(e); }
  });
} else {
  micBtn.style.display = "none";
}

async function reset() {
  await fetch("/reset", { method: "POST" });
  messagesEl.innerHTML = "";
  window.speechSynthesis.cancel();
  addMsg("agent", "Hi! I can check inventory, find slots, and book deliveries. What's on your mind?");
}

addMsg("agent", "Hi! I can check inventory, find slots, and book deliveries. What's on your mind?");
</script>
</body>
</html>
