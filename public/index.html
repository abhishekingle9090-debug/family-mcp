<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Caretaker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f6f3ee;
    color: #2b2b2b;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #app {
    width: 100%;
    max-width: 560px;
    height: 90vh;
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 18px 20px;
    background: #e8f0e6;
    color: #2d4a2d;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header button {
    background: none;
    border: none;
    color: #2d4a2d;
    cursor: pointer;
    font-size: 13px;
    text-decoration: underline;
  }
  #messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 14px;
    max-width: 85%;
    line-height: 1.45;
    font-size: 15px;
    white-space: pre-wrap;
  }
  .user {
    background: #4a6b4a;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .agent {
    background: #f0ede8;
    color: #2b2b2b;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .trace {
    font-size: 11px;
    color: #666;
    font-family: ui-monospace, monospace;
    padding: 6px 10px;
    background: #faf8f4;
    border-radius: 6px;
    align-self: flex-start;
    max-width: 90%;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .trace strong { color: #4a6b4a; }
  form {
    display: flex;
    padding: 12px;
    gap: 8px;
    border-top: 1px solid #eee;
  }
  input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: 24px;
    font-size: 15px;
    outline: none;
  }
  input:focus { border-color: #4a6b4a; }
  button[type=submit] {
    padding: 12px 20px;
    background: #4a6b4a;
    color: white;
    border: none;
    border-radius: 24px;
    cursor: pointer;
    font-size: 15px;
  }
  button[type=submit]:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span>🌿 Family Caretaker</span>
    <button onclick="reset()">Reset</button>
  </header>
  <div id="messages"></div>
  <form id="form">
    <input id="input" placeholder="Ask about inventory or book a delivery..." autocomplete="off" autofocus>
    <button type="submit" id="send">Send</button>
  </form>
</div>
<script>
const messagesEl = document.getElementById("messages");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addTrace(trace) {
  if (!trace || !trace.length) return;
  const div = document.createElement("div");
  div.className = "trace";
  div.innerHTML = trace.map(function(t) {
    var resultShort = String(t.result || "").slice(0, 100);
    return "<strong>" + t.tool + "</strong>(" + JSON.stringify(t.args) + ") → " + resultShort;
  }).join("<br>");
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function send(text) {
  addMsg("user", text);
  input.value = "";
  sendBtn.disabled = true;
  const thinking = addMsg("agent", "…");
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    thinking.textContent = data.reply || data.error || "(no reply)";
    addTrace(data.trace);
  } catch (e) {
    thinking.textContent = "Error: " + e.message;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", function(e) {
  e.preventDefault();
  const v = input.value.trim();
  if (v) send(v);
});

async function reset() {
  await fetch("/reset", { method: "POST" });
  messagesEl.innerHTML = "";
  addMsg("agent", "Hi! I can check inventory, find slots, and book deliveries. What's on your mind?");
}

addMsg("agent", "Hi! I can check inventory, find slots, and book deliveries. What's on your mind?");
</script>
</body>
</html>
